name: Publish to PyPI

# Publishes the package to PyPI when a version tag (v*) is pushed, using PyPI
# Trusted Publishing (OIDC) — no API token is stored in the repo.
#
# One-time setup on PyPI:
#   1. Create the project (first release can be a manual `twine upload`, or use
#      a "pending" trusted publisher before the project exists).
#   2. Project settings -> Publishing -> add a Trusted Publisher:
#        Owner:        PixelPaw-Labs
#        Repository:   PixelFlow
#        Workflow:     publish.yml
#        Environment:  pypi
#   3. (Optional but recommended) create a GitHub "pypi" environment with
#      required reviewers to gate releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
